[project]
name = "traction-engine"
version = "0.1.0"
description = "Job-posting triage pipeline with cost-logged LLM calls and evals"
readme = "README.md"
authors = [
    { name = "MichaelPaulukonis", email = "xraysmalevich@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
triage = "traction_engine.cli:main"

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
